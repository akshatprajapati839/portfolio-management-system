<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portfolio Ledger</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

  <header class="page-header">
    <div class="header-left">
      <span class="eyebrow">holdings ledger</span>
      <h1>Portfolio</h1>
    </div>
    <button id="openAddModal" class="btn btn-primary">+ Add Holding</button>
  </header>

  <!-- summary cards up top, gets filled in by script.js -->
  <section class="summary-grid" id="summaryGrid">
    <div class="summary-card">
      <span class="summary-label">Invested</span>
      <span class="summary-value" id="totalInvested">$0.00</span>
    </div>
    <div class="summary-card">
      <span class="summary-label">Current Value</span>
      <span class="summary-value" id="totalValue">$0.00</span>
    </div>
    <div class="summary-card" id="plCard">
      <span class="summary-label">Profit / Loss</span>
      <span class="summary-value" id="totalPL">$0.00</span>
    </div>
    <div class="summary-card" id="plPercentCard">
      <span class="summary-label">Return</span>
      <span class="summary-value" id="totalPLPercent">0.00%</span>
    </div>
  </section>

  <!-- main table -->
  <section class="table-section">
    <table id="holdingsTable">
      <thead>
        <tr>
          <th>Ticker</th>
          <th>Qty</th>
          <th>Buy Price</th>
          <th>Current Price</th>
          <th>Cost Basis</th>
          <th>Value</th>
          <th>P/L</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="holdingsBody">
        <!-- rows get injected here by script.js -->
      </tbody>
    </table>

    <!-- shows up when there's nothing in the portfolio yet -->
    <div id="emptyState" class="empty-state" style="display:none;">
      <p>No holdings yet.</p>
      <p class="empty-sub">Add your first position to start tracking it.</p>
    </div>
  </section>

  <!-- modal used for both adding and editing, we just relabel it depending on which -->
  <div id="holdingModal" class="modal-overlay" style="display:none;">
    <div class="modal">
      <h2 id="modalTitle">Add Holding</h2>

      <form id="holdingForm">
        <input type="hidden" id="holdingId">

        <label for="ticker">Ticker</label>
        <input type="text" id="ticker" placeholder="e.g. AAPL" required>

        <label for="quantity">Quantity</label>
        <input type="number" step="any" id="quantity" placeholder="e.g. 10" required>

        <label for="purchasePrice">Purchase Price ($)</label>
        <input type="number" step="any" id="purchasePrice" placeholder="e.g. 150.00" required>

        <label for="currentPrice">Current Price ($)</label>
        <input type="number" step="any" id="currentPrice" placeholder="e.g. 175.00" required>

        <div class="modal-actions">
          <button type="button" id="cancelModal" class="btn btn-ghost">Cancel</button>
          <button type="submit" class="btn btn-primary">Save</button>
        </div>
      </form>
    </div>
  </div>

  <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
